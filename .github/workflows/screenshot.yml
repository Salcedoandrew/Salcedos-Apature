name: Screenshot

# REL-30: a screenshot rendered by the headless harness from the build being
# released, published on the release page. The release job builds the DMG once
# and never rebuilds it, so this runs separately against the tag that already
# exists: it checks the tag out, builds exactly that commit, renders the sheet
# and uploads the PNG beside the disk image. Dispatch it after a release, or
# before publishing a draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to render, for example v0.1.12
        required: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  screenshot:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tagged commit
        run: cargo build --release -p apature
      - name: Lay out a small sample shoot
        # The sheet is only worth looking at with photos in it, and a tag cut
        # before the samples existed still needs them, so they come from main
        # rather than from the checkout above.
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- tools/screenshot/samples
          mkdir -p /tmp/sample-shoot
          cp tools/screenshot/samples/*.jpg /tmp/sample-shoot/
          # Distinct capture dates, so the sheet sorts like a real shoot.
          day=12
          for f in /tmp/sample-shoot/IMG_*.jpg; do
            touch -t "202609${day}1030" "$f"
            day=$((day + 1))
          done
          ls -la /tmp/sample-shoot
      - name: Render the sheet with the headless harness
        run: |
          version="${TAG#v}"
          # Enough frames for the thumbnails and the inspector's metadata to
          # settle before the shot is taken.
          target/release/apature /tmp/sample-shoot --screenshot "/tmp/Apature-${version}.png" --frames 150
          ls -la "/tmp/Apature-${version}.png"
        env:
          TAG: ${{ inputs.tag }}
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" "/tmp/Apature-${version}.png" --clobber
