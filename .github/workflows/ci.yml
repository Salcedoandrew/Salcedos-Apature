name: CI

# Linux for the libraries and a type-check of the desktop (cheapest minutes);
# one macOS job builds and tests the desktop crate itself on pushes to main,
# so a commit that does not compile can never sit on main unnoticed.
# A second macOS job type-checks the desktop on pull requests, so a PR that
# breaks macOS-only code (platform/macos.rs, the sips RAW path, the Trash
# method, extract timestamping) fails before it merges instead of after.
# Bundling, signing and the real-card checks stay on the owner's Mac.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

env:
  CARGO_INCREMENTAL: 0
  # No debug info: the desktop's wgpu/eframe tree is slow to build with it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev
      - name: Version in Cargo.toml matches the changelog
        run: bash tools/check-version.sh
      - run: cargo fmt --all --check
      # Clippy type-checks the desktop app too; its tests and full debug
      # build run on the Mac, where it ships.
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --exclude apature

  desktop-macos-check:
    # Check only, no release build and no tests: enough to catch a PR that
    # breaks macOS-only code, at a fraction of the full macOS job's minutes.
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p apature --all-targets

  desktop-macos:
    # macOS minutes cost ten times Linux ones: pushes to main only, and not
    # for docs-only changes.
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p apature -p apature-cli
      - run: cargo test --release -p apature
      - name: Headless smoke test (the sheet renders and a screenshot lands)
        run: |
          mkdir -p /tmp/smoke
          target/release/apature /tmp/smoke --screenshot /tmp/smoke.png --frames 60
          ls -la /tmp/smoke.png

  release-rules:
    # docs/RELEASES.md, the rules a machine can see: no AI attribution, a changelog line per change, the version
    # bump on its own. Pull requests only; labels no-changelog and release-exception waive REL-7 and REL-13.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch, notes and version rules
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/check-release-rules.sh "origin/${{ github.base_ref }}"
