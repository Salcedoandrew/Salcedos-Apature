[package]
name = "apature"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apature: keyboard-first contact sheet, culling and metadata for photojournalists"

[[bin]]
name = "apature"
path = "src/main.rs"

[dependencies]
apature-core.workspace = true
apature-preview.workspace = true
apature-metadata.workspace = true
apature-ingest.workspace = true
apature-export.workspace = true
apature-deliver.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
directories.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
walkdir.workspace = true
image = { workspace = true, features = ["png"] }
muda = "0.21"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
ab_glyph = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
